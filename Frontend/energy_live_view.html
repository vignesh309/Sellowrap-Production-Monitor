<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Energy Meter View</title>
    <link rel="stylesheet" href="/static/css/energy_live_view.css">
</head>
<body>

    <div class="navbar">
        <div class="brand">
            <img src="/static/img/Company_logo.png" alt="Logo" onerror="this.style.display='none'">
            <h2>LIVE ENERGY VIEW</h2>
        </div>

        <div class="nav-utils">
            <button class="hub-btn" onclick="window.location.href='/hub'" title="Return to Hub">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
                Return to Hub
            </button>
            <div class="user-profile">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <span id="user-display" class="user-name">Loading...</span>
                    <span id="role-display" class="user-role">Role</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()" title="Secure Logout">
                <svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"></path></svg>
                Log Out
            </button>
        </div>
    </div>

    <div class="main-container">
        <div class="tree" id="meter_tree">
            <!-- Built dynamically by energy_live_view.js -->
        </div>
    </div>

    <script src="/static/js/energy_live_view.js"></script>
</body>
</html>
