<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Moulding Status</title>
    <link rel="stylesheet" href="static/css/moulding_stage_hourly_status.css">
</head>
<body>

<div class="navbar">
    <div class="brand">
        <img src="/static/img/Company_logo.png" alt="Logo" onerror="this.style.display='none'">
        <h2>Live Moulding Telemetry</h2>
    </div>
    
    <div class="nav-utils">
        <button class="hub-btn" onclick="window.location.href='/hub'" title="Return to Hub">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
            Return to Hub
        </button>

        <div class="user-profile">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-info">
                <span id="user-display" class="user-name">Loading...</span>
                <span id="role-display" class="user-role">Loading Role...</span>
            </div>
        </div>
        
        <button class="logout-btn" onclick="logout()" title="Secure Logout">
            <svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"></path></svg>
            Log Out
        </button>
    </div>
</div>

<div class="status-header">
    <div class="machine-view-box">Moulding Floor View</div>
    
    <div style="display: flex; align-items: center; gap: 15px;">
        <!-- Logical Date Picker -->
        <div class="date-box" style="display: flex; align-items: center; padding: 5px 15px;">
            <span style="color: var(--text-muted); font-size: 12px; margin-right: 10px; font-weight: bold; text-transform: uppercase;">Logical Date:</span>
            <input type="date" id="dateSelect" onchange="fetchMouldingDashboard()" style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; outline: none; color-scheme: dark;">
        </div>

        <!-- Shift Dropdown -->
        <div class="time-slot-box" style="display: flex; align-items: center; padding: 5px 15px;">
            <span style="color: var(--text-muted); font-size: 12px; margin-right: 10px; font-weight: bold; text-transform: uppercase;">Shift:</span>
            <select id="shiftSelect" onchange="fetchMouldingDashboard()" style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; outline: none;">
                <option value="A" style="background: var(--bg-panel); color: white;">Shift A (07:00 - 19:00)</option>
                <option value="B" style="background: var(--bg-panel); color: white;">Shift B (19:00 - 07:00)</option>
            </select>
        </div>
        
        <button onclick="enableFullscreen()" class="hub-btn" style="margin: 0;">📺 Fullscreen TV Mode</button>
    </div>
</div>

<div class="vertical-grid" id="dashboardGrid"></div>

<script src="static/js/moulding_stage_hourly_status.js"></script>

</body>
</html>
