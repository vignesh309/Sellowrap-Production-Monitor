<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Floor Status</title>
<link rel="stylesheet" href="static/css/production_hourly_status.css">
</head>
<body>

<div class="navbar">
    <div class="brand">
        <img src="/static/img/Company_logo.png" alt="Logo">
        <h2>Live Floor Status</h2>
    </div>
    
    <div class="nav-utils">
    <button class="hub-btn" onclick="window.location.href='/hub'" title="Return to Hub">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
        Return to Hub
    </button>

    <div class="user-profile">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
            <span id="user-display" class="user-name">Loading...</span>
            <span id="role-display" class="user-role">Loading Role...</span>
        </div>
    </div>
    
    <button class="logout-btn" onclick="logout()" title="Secure Logout">
        <svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"></path></svg>
        Log Out
    </button>
</div>
</div>

<div class="status-header">
    <div class="machine-view-box">Machine View</div>
    
    <!-- 🚨 NEW: Interactive Controls Container -->
    <div style="display: flex; align-items: center; gap: 15px;">
        
        <!-- Date Picker -->
        <div class="date-box" style="display: flex; align-items: center; padding: 5px 15px;">
            <span style="color: var(--text-muted); font-size: 12px; margin-right: 10px; font-weight: bold; text-transform: uppercase;">Date:</span>
            <!-- Note: color-scheme: dark forces the calendar popup to match your dark theme! -->
            <input type="date" id="dateSelect" onchange="populateMachineGrid()" style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; outline: none; color-scheme: dark;">
        </div>

        <!-- Time Slot Dropdown -->
        <div class="time-slot-box" style="display: flex; align-items: center; padding: 5px 15px;">
            <span style="color: var(--text-muted); font-size: 12px; margin-right: 10px; font-weight: bold; text-transform: uppercase;">Time Slot:</span>
            <select id="timeSlotSelect" onchange="populateMachineGrid()" style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; font-size: 14px; padding: 6px 10px; border-radius: 6px; cursor: pointer; outline: none;">
                <!-- JS will populate this -->
            </select>
        </div>
    </div>
</div>

<div class="slider-container" id="sliderContainer"></div>
    </div>

<script src="static/js/production_hourly_status.js"></script>

</body>
</html>
