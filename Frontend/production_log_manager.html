<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Log Manager</title>
    <link rel="stylesheet" href="/static/css/production_log_manager.css">
</head>
<body>

    <!-- STANDARD ENTERPRISE NAVBAR -->
    <div class="navbar">
        <div class="brand">
            <img src="/static/img/Company_logo.png" alt="Logo" onerror="this.style.display='none'">
            <h2>Manufacturing Analytics</h2>
        </div>
        <div class="nav-utils">
            <button class="hub-btn" onclick="window.location.href='/hub'">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
                Return to Hub
            </button>
            <div class="user-profile">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <span id="user-display" class="user-name">Loading...</span>
                    <span id="role-display" class="user-role">ADMIN</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"></path></svg>
                Log Out
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="main-container">
        
        <!-- HEADER ACTIONS -->
        <div class="canvas-header">
            <div>
                <h2 style="margin: 0; color: var(--text-main);">Hourly Log Manager</h2>
                <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 13px;">Review and delete incorrect production logs to allow operator re-entry.</p>
            </div>
            <button id="btn_delete_selected" class="btn-danger" onclick="deleteSelectedLogs()" disabled>
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor; margin-right: 5px; vertical-align: middle;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"></path></svg>
                Delete Selected Logs
            </button>
        </div>

        <!-- FILTER BAR -->
        <div class="card filter-card">
            <div class="filter-group">
                <label>Date</label>
                <input type="date" id="filter_date">
            </div>
            <div class="filter-group">
                <label>Shift</label>
                <select id="filter_shift">
                    <option value="ALL">All Shifts</option>
                    <option value="A">Shift A</option>
                    <option value="B">Shift B</option>
                    <option value="C">Shift C</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Machine Filter</label>
                <select id="filter_machine">
                    <option value="ALL">All Machines</option>
                    <!-- Populated dynamically -->
                </select>
            </div>
            
            <div class="filter-actions" style="display: flex; gap: 10px; margin-left: auto; align-items: flex-end;">
                <button class="btn-primary" onclick="loadLogs()">
                    🔍 Search Logs
                </button>
                <button class="btn-outline" onclick="clearFilters()">
                    ✕ Clear
                </button>
            </div>
        </div>

        <!-- DATA TABLE -->
        <div class="card table-card">
            <div class="table-container">
                <table class="master-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">
                                <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()">
                            </th>
                            <th>Log ID</th>
                            <th>Date & Shift</th>
                            <th>Machine</th>
                            <th>Part Number</th>
                            <th>Time Block</th>
                            <th class="text-right">Target</th>
                            <th class="text-right">Actual</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logs_table_body">
                        <tr><td colspan="9" class="empty-state">Select filters and click Search to load logs.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/static/js/production_log_manager.js"></script>
</body>
</html>
