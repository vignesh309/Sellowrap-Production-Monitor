<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Production Summary - ERP</title>
    <link rel="stylesheet" href="/static/css/shift_summary.css">
</head>

<body>

    <div class="navbar" id="top-navbar">
        <div class="brand">
            <img src="/static/img/Company_logo.png" alt="Company Logo" style="height: 50px; width: auto; border-radius: 4px;" onerror="this.style.display='none'">
            <h2>SHIFT SUMMARY REPORT</h2>
        </div>

        <div class="nav-utils">
            <button class="hub-btn" onclick="window.location.href='/hub'" title="Return to Hub">
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                </svg>
                Return to Hub
            </button>

            <div class="user-profile">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <span id="user-display" class="user-name">Loading...</span>
                    <span id="role-display" class="user-role">Role</span>
                </div>
            </div>

            <button class="logout-btn" onclick="logout()" title="Secure Logout">
                <svg viewBox="0 0 24 24">
                    <path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"></path>
                </svg>
                Log Out
            </button>
        </div>
    </div>

    <div class="controls-bar">
        <div class="report-controls">
            <label style="color: var(--text-muted); font-size: 12px; font-weight: bold; text-transform: uppercase;">Select Date:</label>
            <input type="date" id="report_date" onchange="loadReport()">

            <label style="color: var(--text-muted); font-size: 12px; font-weight: bold; text-transform: uppercase; margin-left: 15px;">Shift:</label>
            <select id="report_shift" onchange="loadReport()">
                <option value="A">Shift A</option>
                <option value="B">Shift B</option>
            </select>
        </div>
        <button class="btn-fullscreen" onclick="toggleFullScreen()">📺 Fullscreen</button>
    </div>

    <div class="container" id="main-container">
        <div class="card">
            <div class="table-container">
                <table id="report-table">
                    <thead>
                        <tr>
                            <th>MACHINE CODE</th>
                            <th>PART NO</th>
                            <th>PART NAME</th>
                            <th>CUSTOMER</th>
                            <th class="text-right">TARGET</th>
                            <th class="text-right">TOTAL QTY</th>
                            <th class="text-right">OK QTY</th>
                            <th class="text-right">NG QTY</th>
                            <th>OPERATOR(S)</th>
                        </tr>
                    </thead>
                    <tbody id="report-body">
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state" style="display: none;">
                    No production data found for this Shift.
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/shift_summary.js"></script>
</body>

</html>
