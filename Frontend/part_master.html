<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Data: Part & BOM Explorer</title>
    <link rel="stylesheet" href="/static/css/part_master.css">
</head>

<body>

    <div class="navbar">
        <div class="brand">
            <img src="/static/img/Company_logo.png" alt="Logo" onerror="this.style.display='none'">
            <h2>Master Data Management</h2>
        </div>
        <div class="nav-utils">
            <button class="hub-btn" onclick="window.location.href='/hub'">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                </svg>
                Return to Hub
            </button>
            <div class="user-profile">
                <div class="avatar" id="user-avatar">A</div>
                <div class="user-info">
                    <span id="user-display" class="user-name">Admin01</span>
                    <span id="role-display" class="user-role">ADMIN</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z">
                    </path>
                </svg>
                Log Out
            </button>
        </div>
    </div>

    <div class="container">
        <div class="card">

            <div class="explore-header"
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;">
                <h2 class="section-title" style="margin: 0; border: none;">Part Master</h2>

                <div class="search-container" style="display: flex; gap: 10px; align-items: center;">
                    <label style="margin: 0;">Search Part:</label>
                    <input list="part_list" id="search_part_id" placeholder="-- Search a Part to Load --"
                        style="width: 250px; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-input); color: var(--text-main);">

                    <datalist id="part_list"></datalist>
                    <button class="btn-primary" onclick="searchPart()" style="margin: 0;">Load Data</button>
                </div>
            </div>

            <div class="crud-toolbar">
                <button id="btn_new" class="btn-action btn-new" onclick="startNewPart()">➕ NEW</button>
                <button id="btn_edit" class="btn-action btn-edit" onclick="enableEditMode()">✏️ EDIT</button>
                <button id="btn_save" class="btn-action btn-save" onclick="savePart()" disabled>💾 SAVE</button>
                <button id="btn_delete" class="btn-action btn-delete" onclick="deletePart()">🗑️ DELETE</button>
            </div>

            <h3 class="sub-title">1. Core Product Setup</h3>
            <div class="form-grid">
                <div><label>Part NO</label><input type="text" id="part_no" disabled></div>
                <div><label>Part Name</label><input type="text" id="part_name" disabled></div>
                <div>
                    <label>Customer Name</label>
                    <input list="customer_list" id="customer_name" placeholder="e.g. Maruti Suzuki" disabled autocomplete="off">
                    <datalist id="customer_list">
                        <option value="Maruti Suzuki"></option>
                        <option value="Hyundai"></option>
                        <option value="Kia"></option>
                        <option value="Volkswagen"></option>
                        <option value="Tata Motors"></option>
                        <option value="Mahindra"></option>
                    </datalist>
                </div>
            </div>

            <div class="table-section" style="margin-top: 30px; margin-bottom: 40px;">
                <div class="table-header">
                    <h3 class="sub-title" style="margin: 0; border: none;">2. Master Process & Routing Sequence</h3>
                    <button class="btn-inline-add" id="btn_add_row" disabled onclick="addUnifiedRow()">+ Add Step</button>
                </div>

                <datalist id="process_list_options">
                    <option value="MOULDING"></option>
                    <option value="FILM ROLL MAKING"></option>
                    <option value="FRAMING"></option>
                    <option value="BLANKING"></option>
                    <option value="MANUAL PASTING"></option>
                    <option value="ASSEMBLY"></option>
                    <option value="PRESS CUT"></option>
                    <option value="SYSCO CUT"></option>
                    <option value="BANDSAW CUTTING"></option>
                    <option value="DEFLASHING"></option>
                    <option value="PACKING"></option>
                    <option value="FINAL INSPN"></option>
                    <option value="THERMOFORMING"></option>
                    <option value="PRINTING"></option>
                    <option value="THERMOWELDING"></option>
                    <option value="BUTYL PASTING"></option>
                    <option value="PALLETIZATION"></option>
                    <option value="REGRINDING"></option>
                </datalist>

                <div class="table-container">
                    <table class="master-table" style="width: 100%; white-space: nowrap;">
                        <thead>
                            <tr>
                                <th style="width: 50px; text-align: center;">Seq</th>
                                <th style="min-width: 150px;">Process Name</th>
                                <th>Mold NO</th>
                                <th>Mold Name</th>
                                <th>Total Cav</th> 
                                <th>Act Cav</th> 
                                <th>Target/Hr</th>
                                <th>Tgt Temp(°C)</th>
                                <th>Tgt Press</th>
                                <th>Tgt Timer</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="unified_table_body">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/js/part_master.js"></script>

</body>
</html>
